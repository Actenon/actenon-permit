[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actenon-permit"
version = "1.4.0"
description = "Actenon-Permit: an open-source authority broker for AI agents. Bounded, revocable capability grants with hard runtime limits."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Actenon" }]
keywords = ["ai", "agents", "security", "authorization", "pdp", "pep", "capabilities", "policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.5,<3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "actenon-kernel[asymmetric]>=0.1.0",
    "actenon-protocol>=1.1.0,<2",
    # pytest-asyncio is a runtime dep, not a dev dep, because:
    #   1. pyproject.toml sets `asyncio_mode = "auto"` under
    #      `[tool.pytest.ini_options]`, which requires pytest-asyncio to
    #      be importable whenever pytest runs in this project — including
    #      in a plain `pip install -e . && pytest` flow.
    #   2. Fable 5 Part 3G flagged this: four async SDK tests error out
    #      without pytest-asyncio installed, which is the first thing a
    #      contributor hits.
    # Adding ~50KB to the install is preferable to forcing every adopter
    # to know to install `[dev]` before running tests.
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "httpx>=0.27",  # for FastAPI test client
]

[project.scripts]
permit = "actenon_permit.cli:app"
actenon = "actenon_permit.unified_cli:main"

[project.urls]
Homepage = "https://github.com/Actenon/actenon-permit"
Repository = "https://github.com/Actenon/actenon-permit"
Issues = "https://github.com/Actenon/actenon-permit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/actenon_permit"]

[tool.hatch.build.targets.sdist]
# Only include the source package + essential files in the sdist.
# Exclude vendored/accidental content (skills, submodules, tool-results).
include = [
    "/src/actenon_permit",
    "/tests",
    "/scripts",
    "/examples",
    "/README.md",
    "/SPEC.md",
    "/ARCHITECTURE.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "skills",
    "upload",
    "tool-results",
    "Actenon-Permit",
    "actenon-cloud",
    "actenon-kernel",
    "docs",
    ".venv",
    "dist",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Exclude the skills/ directory from linting. This is unrelated third-party
# content (ClawHub skill packages) that was accidentally committed (audit
# finding P-02). It should be removed in a future cleanup, but for now we
# exclude it so CI lint passes.
exclude = ["skills", "upload", "tool-results", "Actenon-Permit", "actenon-cloud", "actenon-kernel"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in defaults (typer uses this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
