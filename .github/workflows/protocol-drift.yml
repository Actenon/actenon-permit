name: Protocol drift gate

# This workflow fails when the pinned actenon-protocol package and this
# repository disagree on:
#   - refusal-code taxonomy (canonical codes + compatibility aliases)
#   - canonicalisation byte output for shared test vectors
#   - protocol version pin
#   - boundary preservation (permit must not import cloud)
#
# See tests/test_protocol_drift.py for the full gate.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 4 * * *"

jobs:
  drift-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run protocol drift gate
        run: uv run pytest tests/test_protocol_drift.py -v --tb=short

      - name: Verify protocol version pin in pyproject.toml
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          assert any('actenon-protocol' in d and '1.1.0' in d for d in deps), (
              f'actenon-protocol >= 1.1.0 not pinned in dependencies: {deps}'
          )
          print('OK: actenon-protocol >= 1.1.0 pinned')
          "

      - name: Verify gateway DENY response carries structured refusal codes
        run: |
          uv run python -c "
          import inspect
          from actenon_permit.gateway import Gateway
          src = inspect.getsource(Gateway.call_tool)
          assert 'disclosed_code' in src, (
              'gateway.call_tool does not emit disclosed_code in DENY response'
          )
          assert 'internal_code' in src, (
              'gateway.call_tool does not emit internal_code in DENY response'
          )
          assert 'retryable' in src, (
              'gateway.call_tool does not emit retryable in DENY response'
          )
          print('OK: gateway DENY response carries structured refusal codes')
          "
