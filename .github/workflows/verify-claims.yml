name: Verify claims

# Machine-enforce every claim the README makes about the package itself.
# Moved out of ci.yml so the README badge can link to a dedicated gate.
# The daily schedule matters: the registry-install check depends on live
# PyPI and npm state, which can change with no PR to catch it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:

# Source-candidate checks only; release_gate refuses these overrides.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/candidate-constraints.txt

jobs:
  verify-claims:
    # Machine-enforce every claim the README makes about the package itself.
    # Fable 5 Part 3A/G: for a trust product, one falsified claim costs more
    # than ten missing features.
    name: Verify README claims (machine-enforced)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check generated Python badge
        run: uv run python scripts/sync_badges.py --check

      - name: Check README registry installs
        run: uv run python scripts/check_readme_installs.py

      - name: Check README ecosystem table in sync with ecosystem.yaml
        # Check the exact locked Protocol already installed above. The runner's
        # system pip mishandles extras on a constrained direct Git requirement.
        run: uv run python -m actenon_protocol.ecosystem --check README.md --repo actenon-permit

      - name: Verify protocol version pin
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          assert any('actenon-protocol' in d and '1.5.0' in d for d in deps), (
              f'actenon-protocol >= 1.5.0 not pinned in dependencies: {deps}'
          )
          print('OK: actenon-protocol >= 1.5.0 pinned')
          "

      - name: Verify pytest-asyncio is a runtime dep
        # Fable 5 Part 3G: four async SDK tests error out without
        # pytest-asyncio installed in a plain `pip install -e . && pytest`
        # flow. Make the dep machine-enforced.
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          assert any('pytest-asyncio' in d for d in deps), (
              f'pytest-asyncio not in runtime deps (Fable 5 Part 3G): {deps}'
          )
          print('OK: pytest-asyncio is a runtime dep')
          "

      - name: Verify the plain-install promise (pip install . && pytest)
        # The README promises "a plain install followed by pytest works out
        # of the box". `uv sync --extra dev` above installs the dev extras,
        # which masks any test dependency declared only under [dev] (httpx
        # for fastapi.testclient was one). Run the promise literally in a
        # clean venv with runtime deps only.
        run: |
          python -m venv /tmp/plain-install
          /tmp/plain-install/bin/pip install --quiet .
          /tmp/plain-install/bin/python -m pytest -q -p no:cacheprovider
