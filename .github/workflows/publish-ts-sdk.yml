name: Publish TypeScript SDK to npm

# Publishes @actenon/sdk from ts-sdk/ to the npm registry.
#
# Triggers on:
#   - Tag pushes matching ts-sdk-v* (e.g. ts-sdk-v1.4.0)
#   - Manual workflow_dispatch
#
# Uses the secret NPM_TOKEN_ACTENON (automation token with publish rights on
# the @actenon scope; the old comment named a secret `NPM` that this workflow
# never read) and the `npm` environment (add required reviewers).

on:
  push:
    tags:
      - "ts-sdk-v*"
  workflow_dispatch:

jobs:
  release-gate:
    # Publish only the exact ts-sdk-v<version> tag, on a commit that is on main
    # and whose required checks (.github/required-checks.json "release") passed.
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag commit is on main and its required checks passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py gate --tag-prefix ts-sdk-v --version-from ts-sdk/package.json

  build:
    needs: release-gate
    name: Build @actenon/sdk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (for spawning the Python gateway in TS tests)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python package (so TS tests can spawn the gateway)
        run: uv sync --locked --extra dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install TS SDK deps
        working-directory: ts-sdk
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        working-directory: ts-sdk
        run: bun run typecheck

      - name: Run tests (including the e2e tests that spawn the Python gateway)
        working-directory: ts-sdk
        run: bun test

      - name: Build
        working-directory: ts-sdk
        run: bun run build

      - name: Verify package contents (npm pack dry-run)
        working-directory: ts-sdk
        run: bun run pack:test

      - name: Built package imports and verifies grant tokens in plain Node (ESM)
        working-directory: ts-sdk
        run: bun run smoke:node

      - name: Pack the tarball that will be published
        working-directory: ts-sdk
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"

      - name: The exact tarball imports under plain Node.js
        run: bash scripts/smoke-npm-installed.sh "$(ls "$RUNNER_TEMP"/pkg/*.tgz)" @actenon/sdk Actenon ExecutionRefusedError canonicalizeJson canonicalizeStrictJson verifyResourceReceipt encodeGrantToken verifyGrantToken

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm provenance
    if: startsWith(github.ref, 'refs/tags/ts-sdk-v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: pkg

      - name: Publish the tested tarball (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_ACTENON }}
        run: npm publish pkg/*.tgz --access public --provenance

      - name: Install from the registry and import under plain Node.js
        run: |
          version="$(node -p "require('./ts-sdk/package.json').version")"
          for _ in $(seq 1 30); do
            npm view "@actenon/sdk@${version}" version >/dev/null 2>&1 && break
            sleep 10
          done
          bash scripts/smoke-npm-installed.sh "@actenon/sdk@${version}" @actenon/sdk Actenon ExecutionRefusedError canonicalizeJson canonicalizeStrictJson verifyResourceReceipt encodeGrantToken verifyGrantToken
