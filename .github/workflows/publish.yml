name: Publish to PyPI

# Build the wheel + sdist and publish to PyPI on tag pushes.
# Tags must match the pattern v* (e.g. v1.4.0).
#
# Two publishing modes are supported:
#
# 1. Trusted publishing (OIDC) — preferred. No API token needed.
#    The PyPI project must be configured to trust this workflow at:
#    https://pypi.org/manage/project/actenon-permit/settings/publishing/
#
# 2. API token — fallback. Set the PYPI_API_TOKEN secret in the
#    repository's GitHub Actions secrets. The token must have upload
#    permission for the actenon-permit project.
#
# The workflow uses trusted publishing if PYPI_API_TOKEN is NOT set,
# and falls back to the API token if it is.

on:
  push:
    tags:
      - "v*"
  # Allow manual triggers for testing the build step without publishing.
  workflow_dispatch:

jobs:
  release-gate:
    # Publish only the exact v<version> tag, on a commit that is on main
    # and whose required checks (.github/required-checks.json "release") passed.
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag commit is on main and its required checks passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py gate --tag-prefix v --version-from pyproject.toml

  build:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Verify the wheel installs in a clean venv
        run: |
          python -m venv /tmp/test-install
          /tmp/test-install/bin/pip install --upgrade pip
          /tmp/test-install/bin/pip install dist/actenon_permit-*.whl
          /tmp/test-install/bin/python -c "
          from actenon_permit import Actenon, GitHubAdapter
          client = Actenon.local(agent_id='ci-test', scopes=['github.issue.create'], signing_key='ci-test-key')
          print('OK:', type(client).__name__, client.capabilities.transport)
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only publish on tag pushes (not workflow_dispatch).
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      # Required for trusted publishing (OIDC).
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        if: ${{ !env.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Publish to PyPI (API token)
        if: ${{ env.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  verify-registry:
    # Post-publish: install the released version from PyPI (never the local
    # build) into a clean venv, outside the checkout, and exercise it.
    name: Install from PyPI and run the demo
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
      - run: |
          version="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          for _ in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/actenon-permit/${version}/json" >/dev/null && break
            sleep 20
          done
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install "actenon-permit==${version}"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/v/bin/python" -c "import actenon_permit, actenon, importlib.metadata as m; assert 'site-packages' in actenon_permit.__file__; print(m.version('actenon-permit'), m.version('actenon-kernel'))"
          "$RUNNER_TEMP/v/bin/permit" demo --auto-approve
