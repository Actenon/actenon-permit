name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly live-compat: run against current kernel main so drift is
    # caught in a day, not at a customer. (ARCHITECTURE.md §6)
    - cron: "0 3 * * *"

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check generated Python badge
        if: matrix.python-version == '3.12'
        run: uv run python scripts/sync_badges.py --check

      - name: Check README registry installs
        if: matrix.python-version == '3.12'
        run: uv run python scripts/check_readme_installs.py

      - name: Check README ecosystem table in sync with ecosystem.yaml
        run: |
          pip install "actenon-protocol[yaml]" --quiet
          python -m actenon_protocol.ecosystem --check README.md --repo actenon-permit
      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Run v0 demo (smoke test)
        run: uv run permit demo --auto-approve

      - name: Run v1 gateway demo (smoke test)
        run: uv run permit demo --mode gateway --auto-approve

  kernel-conformance:
    # Phase 2: cross-repo conformance — run the kernel's own conformance
    # suite against the installed kernel to prove the spine is intact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install permit (which pulls actenon-kernel)
        run: uv sync --extra dev

      - name: Run kernel conformance suite
        # Run from /tmp so permit's local examples/ directory doesn't
        # shadow the kernel's examples.invoice_payment_guard_local
        # package installed in site-packages (namespace collision).
        run: cd /tmp && uv run --project ${{ github.workspace }} python -m actenon.cli conformance run --require-complete

      - name: Run cross-repo PCCB conformance test
        run: uv run pytest tests/test_cross_repo_conformance.py -v

  test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (for spawning the python gateway in TS tests)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python package (so TS tests can spawn the gateway)
        run: uv sync --extra dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install TS SDK deps
        working-directory: ts-sdk
        run: bun install

      - name: TypeScript typecheck
        working-directory: ts-sdk
        run: bun run typecheck

      - name: TS SDK tests
        working-directory: ts-sdk
        run: bun test

  verify-claims:
    # Machine-enforce every claim the README makes about the package itself.
    # Fable 5 Part 3A/G: for a trust product, one falsified claim costs more
    # than ten missing features.
    name: Verify README claims (machine-enforced)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check generated Python badge
        run: uv run python scripts/sync_badges.py --check

      - name: Check README registry installs
        run: uv run python scripts/check_readme_installs.py

      - name: Check README ecosystem table in sync with ecosystem.yaml
        run: |
          pip install "actenon-protocol[yaml]" --quiet
          python -m actenon_protocol.ecosystem --check README.md --repo actenon-permit

      - name: Verify protocol version pin
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          assert any('actenon-protocol' in d and '1.1.0' in d for d in deps), (
              f'actenon-protocol >= 1.1.0 not pinned in dependencies: {deps}'
          )
          print('OK: actenon-protocol >= 1.1.0 pinned')
          "

      - name: Verify pytest-asyncio is a runtime dep
        # Fable 5 Part 3G: four async SDK tests error out without
        # pytest-asyncio installed in a plain `pip install -e . && pytest`
        # flow. Make the dep machine-enforced.
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          assert any('pytest-asyncio' in d for d in deps), (
              f'pytest-asyncio not in runtime deps (Fable 5 Part 3G): {deps}'
          )
          print('OK: pytest-asyncio is a runtime dep')
          "

